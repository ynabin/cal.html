<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .result {
            font-weight: bold;
            color: #007BFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Arithmetic Operations Form</h2>
        <form id="arithmeticForm">
            <label for="num1">First Number:</label>
            <input type="number" id="num1" name="num1" required>

            <label for="num2">Second Number:</label>
            <input type="number" id="num2" name="num2" required>

            <label for="operation">Select Operation:</label>
            <select id="operation" name="operation" required>
                <option value="add">Addition (+)</option>
                <option value="subtract">Subtraction (-)</option>
                <option value="multiply">Multiplication (*)</option>
                <option value="divide">Division (/)</option>
            </select>

            <button type="button" onclick="calculateResult()">Calculate</button>
        </form>

        <div>
            <p>Result: <span id="resultBox" class="result">--</span></p>
        </div>
    </div>

    <script>
        function calculateResult() {
            // Get form inputs
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const operation = document.getElementById('operation').value;
            let result;

            // Perform arithmetic based on selected operation
            if (isNaN(num1) || isNaN(num2)) {
                result = 'Please enter valid numbers';
            } else {
                switch (operation) {
                    case 'add':
                        result = num1 + num2;
                        break;
                    case 'subtract':
                        result = num1 - num2;
                        break;
                    case 'multiply':
                        result = num1 * num2;
                        break;
                    case 'divide':
                        result = num2 !== 0 ? (num1 / num2) : 'Cannot divide by zero';
                        break;
                    default:
                        result = 'Invalid operation';
                }
            }

            // Display the result
            document.getElementById('resultBox').textContent = result;
        }
    </script>
</body>
</html>
